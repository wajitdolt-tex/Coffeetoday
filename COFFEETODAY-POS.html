<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coffee POS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2B1D14">
<meta name="format-detection" content="telephone=no">
<title>COFFEETODAY POS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#FBF5EC;--panel:#FFFFFF;--ink:#3A2617;--muted:#94765E;--line:#EBDCC9;--line2:#F3E8DA;
  --brand:#7A4A28;--brandD:#4E2C16;--brandL:#A8703F;--gold:#D9A441;--goldL:#FFF3D6;
  --cream:#FFF8EC;--soft:#FBF1E4;--tint:#F6E9D8;
  --ok:#2E8B57;--okBg:#E3F4EA;--warn:#A86500;--warnBg:#FFF1D6;--err:#C0392B;--errBg:#FDECEA;
  --lm:#00A84F;--lmD:#007A3A;--lmBg:#E3F8EC;
  --shadow:0 6px 22px rgba(78,44,22,.16);--cardsh:0 2px 8px rgba(122,74,40,.10)
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Sukhumvit Set","Helvetica Neue",sans-serif;font-size:15px;-webkit-user-select:none;user-select:none;overflow:hidden}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit;font-size:16px;color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ===== HEADER ===== */
#hdr{height:60px;padding:0 12px;padding-top:env(safe-area-inset-top);box-sizing:content-box;
  background:linear-gradient(135deg,#5A3319,#7A4A28);color:#fff;display:flex;align-items:center;gap:10px;
  box-shadow:0 3px 12px rgba(58,38,23,.35);position:relative;z-index:20}
#hdr .brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
#hdr .logo{width:40px;height:40px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#hdr .logo img{width:32px;height:32px}
#hdr .bn{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap}
#hdr .bs{font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap}
.chrow{flex:1;display:flex;gap:4px;background:rgba(0,0,0,.22);border-radius:12px;padding:4px;max-width:420px;margin:0 auto}
.chrow button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.8);padding:9px 8px;border-radius:9px;font-weight:800;font-size:13px;white-space:nowrap}
.chrow button.on{background:var(--gold);color:#3A2617;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.chrow button.on.lm{background:var(--lm);color:#fff}
#nav{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
#nav button{background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 11px;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
#nav button.on{background:#fff;color:var(--brand)}
#nav .ic{font-size:16px}
#sync{display:flex;align-items:center;gap:6px;font-size:11px;background:rgba(0,0,0,.2);padding:7px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
#sync .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}
#sync.ok .dot{background:#69F0AE}#sync.busy .dot{background:#FFD54F}#sync.err .dot{background:#FF8A80}
body:not(.v-sell) .chrow{visibility:hidden}
@media (max-width:1100px){#nav .tx{display:none}#nav button{padding:9px}}
@media (max-width:899px){.chrow{display:none}#hdr .bs{display:none}}
@media (max-width:520px){#sync .tx{display:none}#hdr .brand>div:last-child{display:none}#nav{gap:2px}}

main{height:calc(100% - 60px - env(safe-area-inset-top));overflow:hidden}
.view{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px;max-width:1100px;margin:0 auto}

/* ===== SELL ===== */
#v-sell{overflow:hidden}
.sell{display:grid;grid-template-columns:1fr 380px;height:100%}
.mpane{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
#banner{padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;border-bottom:2px solid var(--line);flex-shrink:0}
#banner.walkin{background:linear-gradient(135deg,#FFF8E8,#FCEBD2)}
#banner.lineman{background:linear-gradient(135deg,#EAFFF3,#CFF5DF);border-bottom-color:#B5E8CB}
#banner .bt{font-size:20px;font-weight:800;color:var(--brandD);letter-spacing:.5px}
#banner .bc{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--brand)}
#banner.lineman .bc{color:var(--lmD)}
#banner .bc small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px}
#banner .mobch{display:none;margin-top:6px}
@media (max-width:899px){#banner .mobch{display:flex}#banner .bc{display:none}#banner{padding:10px 12px}}
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--brandL),var(--brand));color:#fff}
.seg button.on.lm{background:linear-gradient(135deg,#1FC46B,var(--lmD));color:#fff}
.stop{display:flex;gap:8px;padding:10px 12px 4px;align-items:center;flex-shrink:0}
.search{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 16px;outline:none}
.search:focus{border-color:var(--brandL)}
#cats{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 8px;scrollbar-width:none;flex-shrink:0}
#cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;border:1.5px solid var(--line);background:#fff;padding:8px 15px;border-radius:20px;font-weight:700;font-size:13px;color:var(--brand);white-space:nowrap}
.cat.on{background:linear-gradient(135deg,var(--brandL),var(--brand));border-color:var(--brand);color:#fff;box-shadow:0 3px 8px rgba(122,74,40,.25)}
#grid{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 12px 100px}
.slbl{font-size:11px;font-weight:800;color:var(--brandL);letter-spacing:1.2px;margin:14px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--line)}
.slbl:first-child{margin-top:6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mc{background:#fff;border-radius:16px;overflow:hidden;border:1.5px solid var(--line2);box-shadow:var(--cardsh);text-align:left;padding:0;display:flex;flex-direction:column;position:relative}
.mc:active{transform:scale(.97);opacity:.85}
.mc-img{height:78px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}
.mc-img.hot{background:linear-gradient(135deg,#FFF1E3,#FFE4CC)}
.mc-img.iced{background:linear-gradient(135deg,#EAF4FF,#D8EAFF)}
.mc-img.blend{background:linear-gradient(135deg,#F4EEFF,#E7DDFF)}
.mc-img.mix{background:linear-gradient(135deg,#FFF6E6,#F6E6D2)}
.mc-img.tea{background:linear-gradient(135deg,#ECF8EE,#D9F0DE)}
.mc-img.fruit{background:linear-gradient(135deg,#FFEFF3,#FFDDE6)}
.mc-img.snack{background:linear-gradient(135deg,#FFFBE6,#FFF0BF)}
.mc-img .tp{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.mc-img .tp i{font-style:normal;font-size:10px;font-weight:800;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 5px;color:var(--brand)}
.mc-body{padding:8px 10px 10px}
.mc-nm{font-size:14px;font-weight:700;line-height:1.3;color:var(--ink)}
.mc-vs{font-size:11px;color:var(--muted);margin-top:1px}
.mc-pr{font-size:15px;font-weight:800;color:var(--brand);margin-top:3px}
#v-sell.lm .mc-pr{color:var(--lmD)}
.mc.so{opacity:.45}
.mc.so .mc-img::after{content:"หมด";position:absolute;inset:auto 0 0 0;background:rgba(192,57,43,.9);color:#fff;font-size:12px;font-weight:800;text-align:center;padding:2px 0}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.7}

/* cart panel */
#cart{background:#fff;border-left:1.5px solid var(--line);display:flex;flex-direction:column;height:100%;min-height:0}
.chd{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line2)}
.chd b{font-size:16px;display:flex;align-items:center;gap:7px}
.bdgn{background:linear-gradient(135deg,var(--brandL),var(--brand));color:#fff;font-size:11px;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.chtag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--goldL);color:var(--brand)}
.chtag.lm{background:var(--lmBg);color:var(--lmD)}
.lnk{background:none;border:1.5px solid var(--line);border-radius:9px;color:var(--muted);font-weight:700;font-size:12px;padding:5px 11px}
#cartList{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px}
.cl{padding:11px 0;border-bottom:1px solid var(--line2)}
.cl .r1{display:flex;gap:10px;align-items:flex-start}
.cl .ci{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cl .nm{flex:1;font-weight:700;line-height:1.3;font-size:14px;min-width:0}
.cl .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;font-weight:500}
.cl .amt{font-weight:800;white-space:nowrap;color:var(--brand)}
.cl .r2{display:flex;align-items:center;gap:7px;margin-top:8px;padding-left:48px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--soft);font-size:18px;font-weight:800;border-radius:10px;color:var(--brand)}
.qty button:active{background:var(--tint)}
.qty span{min-width:28px;text-align:center;font-weight:800}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--brand)}
.mini.del{color:var(--err);border-color:#F2C9C4}
.cft{padding:12px 16px;border-top:1.5px solid var(--line);background:var(--cream);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.trow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.trow.big{font-size:22px;color:var(--ink);font-weight:800;margin:8px 0 12px;padding-top:8px;border-top:2px solid var(--line)}
.trow.big span:last-child{color:var(--brand)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brandL),var(--brandD));box-shadow:0 5px 16px rgba(122,74,40,.32)}
.btn:active{opacity:.88}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.lm{background:linear-gradient(135deg,#1FC46B,var(--lmD));box-shadow:0 5px 16px rgba(0,122,58,.3)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#E0574A,#B3261E);box-shadow:0 5px 16px rgba(179,38,30,.28)}
.btn.gold{background:linear-gradient(135deg,#F0C062,#C98D20);color:#3A2617}
.btn.sm{padding:12px;font-size:15px;border-radius:12px}
#cartBar{display:none}
#cartShade{display:none}
@media (max-width:899px){
  .sell{grid-template-columns:1fr}
  #cart{position:fixed;left:0;right:0;bottom:0;top:10%;height:auto;z-index:40;border-left:none;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(58,38,23,.25);transform:translateY(105%);transition:transform .28s ease}
  #cart.open{transform:translateY(0)}
  #cart .chd::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;background:var(--line);border-radius:2px}
  #cart .chd{position:relative;padding-top:18px}
  #cartBar{display:flex;position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;background:linear-gradient(135deg,var(--brandL),var(--brandD));color:#fff;border-radius:30px;padding:12px 18px;align-items:center;gap:10px;font-weight:800;box-shadow:0 8px 22px rgba(78,44,22,.45);border:none;font-size:15px;transition:transform .12s}
  #cartBar.lm{background:linear-gradient(135deg,#1FC46B,var(--lmD));box-shadow:0 8px 22px rgba(0,122,58,.4)}
  #cartBar .fbn{background:#fff;color:var(--brand);min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 5px}
  #cartBar.lm .fbn{color:var(--lmD)}
  #cartShade:not(.hide){display:block;position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:35}
}

/* ===== LIST / CARDS ===== */
.box{background:#fff;border:1.5px solid var(--line2);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--cardsh)}
.box h3{font-size:14px;margin-bottom:12px;color:var(--brand);display:flex;align-items:center;gap:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.in{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;min-width:0;outline:none}
.in:focus{border-color:var(--brandL)}
.lbl{font-size:12px;color:var(--brandL);font-weight:800;margin-bottom:4px;display:block}
.fld{margin-bottom:10px}
.fld .in{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bill{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line2)}
.bill:last-child{border-bottom:none}
.bill .bi{width:40px;height:40px;border-radius:11px;background:var(--goldL);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.bill .bi.lm{background:var(--lmBg)}
.bill .t{font-size:12px;color:var(--muted);font-weight:700}
.bill .no{font-weight:800;font-size:14px}
.bill .ds{font-size:12px;color:var(--muted);margin-top:2px}
.bill .am{margin-left:auto;font-weight:800;white-space:nowrap;color:var(--brand);font-size:16px}
.bill.void{opacity:.55}
.bill.void .am{text-decoration:line-through;color:var(--err)}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;margin-right:4px}
.tag.lm{background:var(--lmBg);color:var(--lmD)}
.tag.v{background:var(--errBg);color:var(--err)}
.tag.q{background:var(--warnBg);color:var(--warn)}
.tag.c{background:var(--goldL);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1.5px solid var(--line2);border-radius:15px;padding:13px;display:flex;align-items:center;gap:11px;box-shadow:var(--cardsh)}
.stat .si{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.si.a{background:var(--goldL)}.si.b{background:#EAF4FF}.si.c{background:var(--okBg)}.si.d{background:#F4EEFF}
.stat .k{font-size:11px;color:var(--muted);font-weight:700}
.stat .v{font-size:20px;font-weight:800;margin-top:2px;line-height:1.1}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bar .bl{width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar .bt{flex:1;height:22px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar .bf{height:100%;background:linear-gradient(90deg,var(--brandL),var(--brand));border-radius:7px}
.bar .bv{width:90px;text-align:right;font-weight:800}
.hours{display:flex;align-items:flex-end;gap:3px;height:110px}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.hours i{display:block;width:100%;background:linear-gradient(180deg,var(--gold),var(--brandL));border-radius:4px 4px 0 0;min-height:2px}
.hours span{font-size:9px;color:var(--muted);margin-top:3px}
.sumtbl{width:100%;border-collapse:collapse;font-size:14px}
.sumtbl td{padding:7px 2px;border-bottom:1px solid var(--line2)}
.sumtbl td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sumtbl tr.h td{font-weight:800;border-bottom:2px solid var(--line);color:var(--brandD)}
.sumtbl tr.s td{padding-left:18px;color:var(--muted)}
.sumtbl tr.big td{font-size:18px;font-weight:800;color:var(--brand);border-top:2px solid var(--line)}
.atabs{display:inline-flex;gap:3px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;max-width:100%}
.mrow{display:grid;grid-template-columns:1fr 84px 84px 52px 52px 40px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.mrow .n{font-weight:700;font-size:14px;line-height:1.3}
.mrow .n small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.mrow .in{width:100%;padding:7px 6px;text-align:right}
.mhd{font-size:11px;color:var(--brandL);font-weight:800}
.tg{width:46px;height:28px;border-radius:14px;border:none;background:var(--line);position:relative;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--ok)}
.tg.on::after{left:21px}
.tg.so.on{background:var(--err)}
@media (max-width:600px){.mrow{grid-template-columns:1fr 70px 70px 48px 40px}.mrow .c-so{display:none}.row2{grid-template-columns:1fr}}

/* ===== MODAL / SHEET ===== */
#shade{position:fixed;inset:0;background:rgba(30,18,10,.48);z-index:60;display:none}
#modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:22px;box-shadow:0 14px 44px rgba(58,38,23,.3);display:none}
#modal.wide{width:min(760px,96vw)}
@media (max-width:899px){
  #modal,#modal.wide{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:90vh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  #modal .mh::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;background:var(--line);border-radius:2px}
}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line2);margin-bottom:12px}
.mh h2{font-size:18px;color:var(--brandD);display:flex;align-items:center;gap:10px}
.mh h2 .hi{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.mh h2 small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.x{border:none;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:16px;font-weight:800;color:var(--brand);flex-shrink:0}
.mb{padding:0 18px 18px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.opt{border:2px solid var(--line);background:var(--soft);border-radius:22px;padding:10px 16px;font-weight:700;font-size:14px;text-align:center;color:var(--ink)}
.opt small{font-weight:800;color:var(--brand);font-size:13px;margin-left:5px}
.opt.on{border-color:var(--brand);background:var(--goldL);color:var(--brandD);box-shadow:0 2px 8px rgba(122,74,40,.18)}
.opt:disabled{opacity:.35}
.opt.big{border-radius:16px;padding:12px 16px;min-width:110px}
.opt.big small{display:block;margin:2px 0 0}
.sec{font-size:11px;font-weight:800;color:var(--brandL);letter-spacing:1px;margin:4px 0 9px}
.adl{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2)}
.adl .an{font-weight:700;font-size:14px}
.adl .ap{font-size:12px;color:var(--brand);font-weight:700}
.adl.on .an{color:var(--brandD)}
.paybig{text-align:center;padding:14px 0 16px;margin:0 0 14px;background:linear-gradient(135deg,#FFF8E8,#FCEBD2);border-radius:18px}

"./QRPolynomial":function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

},

"./QRMath":function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}

	getLengthInBits : function() {
		return this.length;

	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

/* ---------------- utils ---------------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function r2(n){return Math.round((Number(n)||0)*100+1e-9)/100;}
function money(n){var s=r2(n).toFixed(2);var p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return p.join('.');}
function baht(n){n=r2(n);var s=(n%1===0)?String(n):n.toFixed(2);return '฿'+s.replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function pad(n,w){n=String(n);while(n.length<(w||2))n='0'+n;return n;}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(s,k){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+k);return ymd(d);}
function thDate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function dtStr(iso){var d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function hm(iso){var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function ext(a,b){for(var k in b)if(b.hasOwnProperty(k))a[k]=b[k];return a;}
function num(v){if(v===''||v==null)return null;var n=Number(String(v).replace(/,/g,''));return isNaN(n)?null:n;}
function lsGet(k,d){try{var v=localStorage.getItem(PFX+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}}
function toast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('toasts').appendChild(t);setTimeout(function(){t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300);},type==='err'?4500:2600);}

/* ---------------- Supabase ---------------- */
function sb(method,path,body,prefer,opt){
  opt=opt||{};
  if(MODE==='demo')return Promise.reject(new Error('demo'));
  return authFresh().then(function(){
    var h={'apikey':SB_KEY,'Authorization':'Bearer '+(opt.anon?SB_KEY:tok()),'Content-Type':'application/json'};
    if(prefer)h['Prefer']=prefer;
    return fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  }).then(function(r){
    if(r.status===401&&!opt.retry&&MODE==='live'&&SESSION){SESSION.expires_at=0;return sb(method,path,body,prefer,{anon:opt.anon,retry:true});}
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.slice(0,200));});
    if(r.status===204||r.status===201)return r.text().then(function(t){return t?JSON.parse(t):null;});
    return r.text().then(function(t){return t?JSON.parse(t):null;});
  });
}
function upsert(table,rows,key){if(MODE==='demo')return Promise.resolve(null);return sb('POST',table+'?on_conflict='+(key||'id'),rows,'resolution=merge-duplicates,return=minimal');}

function setSync(st,tx){
  var el=$('sync');
  if(MODE==='demo'){el.className='ok';$('syncTx').textContent='โหมดทดลอง';return;}
  el.className=st;if(st==='ok')lsSet('last_sync',new Date().toISOString());
  var pend=OUTBOX.length;
  $('syncTx').textContent=tx||(st==='ok'?(pend?'รอส่ง '+pend:'ซิงค์แล้ว'):st==='busy'?'กำลังซิงค์…':st==='err'?('ออฟไลน์'+(pend?' · รอส่ง '+pend:'')):'—');
}
function saveOrders(){
  // ตัดบิลเก่ากว่า 10 วันที่ส่งขึ้นแล้วออกจากเครื่อง
  var lim=addDays(ymd(),-10),ob={};for(var i=0;i<OUTBOX.length;i++)ob[OUTBOX[i]]=1;
  for(var id in ORD){if(ORD.hasOwnProperty(id)&&ORD[id].business_date<lim&&!ob[id])delete ORD[id];}
  lsSet('orders',ORD);lsSet('outbox',OUTBOX);
}
function queueOrder(o){
  o.updated_at=new Date().toISOString();
  ORD[o.id]=o;
  if(OUTBOX.indexOf(o.id)<0)OUTBOX.push(o.id);
  saveOrders();flush();
}
function flush(){
  if(S.syncing)return;
  if(MODE==='live'&&!SESSION)return;
  var sp=lsGet('shift_pend',null);if(sp&&MODE==='live')pushShift(sp);
  if(!OUTBOX.length){setSync('ok');return;}
  S.syncing=true;setSync('busy');
  var ids=OUTBOX.slice(0,50),rows=[],stamp={};
  for(var i=0;i<ids.length;i++){var o=ORD[ids[i]];if(o){rows.push(o);stamp[o.id]=o.updated_at;}}
  var hasMem=rows.some(function(r){return r.hasOwnProperty('member');});
  if(hasMem)rows=rows.map(function(r){if(r.hasOwnProperty('member'))return r;var c=ext({},r);c.member=null;return c;});
  upsert('pos_orders',rows).then(function(){
    OUTBOX=OUTBOX.filter(function(id){return !(stamp[id]&&ORD[id]&&ORD[id].updated_at===stamp[id]);});
    saveOrders();S.syncing=false;S.online=true;
    if(OUTBOX.length)flush();else setSync('ok');
  },function(e){
    S.syncing=false;S.online=false;setSync('err');
    if(String(e.message).indexOf('404')===0||String(e.message).indexOf('42P01')>=0)toast('ยังไม่ได้สร้างตาราง pos_orders ใน Supabase','err');
  });
}
function fetchOrders(from,to,branchCode){
  var path='pos_orders?select=*&business_date=gte.'+from+'&business_date=lte.'+to+(branchCode?'&branch_code=eq.'+branchCode:'')+'&order=created_at.desc&limit=10000';
  function local(){var a=[];for(var id in ORD){if(!ORD.hasOwnProperty(id))continue;var o=ORD[id];if(o.business_date>=from&&o.business_date<=to&&(!branchCode||o.branch_code===branchCode))a.push(o);}return a;}
  return sb('GET',path).then(function(rows){
    S.online=true;var map={},i;
    for(i=0;i<rows.length;i++)map[rows[i].id]=rows[i];
    var loc=local();
    for(i=0;i<loc.length;i++){var l=loc[i],s=map[l.id];if(!s||OUTBOX.indexOf(l.id)>=0||(l.updated_at>(s.updated_at||'')))map[l.id]=l;}
    var out=[];for(var k in map)if(map.hasOwnProperty(k))out.push(map[k]);
    out.sort(function(a,b){return a.created_at<b.created_at?1:-1;});
    return {rows:out,offline:false};
  },function(){
    S.online=false;setSync('err');
    var out=local();out.sort(function(a,b){return a.created_at<b.created_at?1:-1;});
    return {rows:out,offline:MODE!=='demo'};
  });
}

function migrateMenu(){

function priceOf(it,ch){
  var o=(it.bp&&it.bp[CFG.branch])||{};
  var p=(o.p!=null&&o.p!=='')?Number(o.p):(it.price!=null&&it.price!==''?Number(it.price):null);
  if(ch==='lineman'){var l=(o.lm!=null&&o.lm!=='')?Number(o.lm):(it.price_lm!=null&&it.price_lm!==''?Number(it.price_lm):null);if(l!=null)return l;}
  return p;

function isSoldOut(it){return !!(it.so&&it.so[CFG.branch]);}
function priced(it){return priceOf(it,'walkin')!=null;}
function sellable(it){return it.active!==false&&(priced(it)||!SET.hideNoPrice);}
function menuById(id){for(var i=0;i<MENU.length;i++)if(MENU[i].id===id)return MENU[i];return null;}
function groups(all){
  var g={},order=[],pmin={},cmin={},sp=!all&&uiCfg().split;
  for(var i=0;i<MENU.length;i++){var it=MENU[i];if(!all&&(!sellable(it)||catHidden(it.category||'อื่นๆ')))continue;
    var k=(it.category||'อื่นๆ')+'|'+it.grp+(sp?'|'+it.id:'');
    if(!g[k]){g[k]={key:k,cat:it.category||'อื่นๆ',grp:sp?(it.receipt_name||it.grp):it.grp,split:sp,items:[],sort:it.sort||0};order.push(k);}
    g[k].items.push(it);if((it.sort||0)<g[k].sort)g[k].sort=it.sort||0;
    var pk=(it.category||'อื่นๆ')+'|'+it.grp;if(pmin[pk]==null||(it.sort||0)<pmin[pk])pmin[pk]=it.sort||0;g[k].pk=pk;
    var ck=it.category||'อื่นๆ';if(cmin[ck]==null||(it.sort||0)<cmin[ck])cmin[ck]=it.sort||0;}
  var arr=order.map(function(k){return g[k];});
  if(sp)arr.sort(function(a,b){return (catRank(a.cat)-catRank(b.cat))||(cmin[a.cat]-cmin[b.cat])||(tempRank(a.items[0])-tempRank(b.items[0]))||(pmin[a.pk]-pmin[b.pk])||(a.sort-b.sort);});
  else arr.sort(function(a,b){return (catRank(a.cat)-catRank(b.cat))||(a.sort-b.sort);});
  for(var j=0;j<arr.length;j++)arr[j].items.sort(function(a,b){return (a.sort||0)-(b.sort||0);});
  return arr;
}
var TEMPS=[['ร้อน','☕ ร้อน'],['เย็น','🧊 เย็น'],['ปั่น','🥤 ปั่น']];
function tempOf(it){var v=(it&&it.variant)||'';for(var i=0;i<TEMPS.length;i++)if(v.indexOf(TEMPS[i][0])>=0)return TEMPS[i][0];return '';}
function sizeOf(it){var m=String((it&&it.variant)||'').match(/(\d+)\s*oz/i);return m?+m[1]:0;}
function secOf(it){var t=tempOf(it);return t&&sizeOf(it)?t+' '+sizeOf(it)+' oz':t;}
function tempRank(it){var t=tempOf(it);for(var i=0;i<TEMPS.length;i++)if(TEMPS[i][0]===t)return i+sizeOf(it)/100;return 9;}

     '<button class="btn'+(S.ch==='lineman'?' lm':'')+'" style="flex:1" data-act="pkOk">'+(PK.edit!=null?'บันทึก':'เพิ่มลงตะกร้า')+' · '+baht(pickerTotal())+'</button></div></div>';

/* ---------------- payment ---------------- */
function activePay(){return SET.pay.filter(function(m){return m.active&&m.type!=='lineman';});}
function promoById(id){for(var i=0;i<PROMOS.length;i++)if(PROMOS[i].id===id)return PROMOS[i];return null;}
function discAmt(sub){var md=memberDiscAmt();return r2(md+promoAmt(r2(sub-md)));}
function promoAmt(sub){
  if(!P||!P.disc)return 0;var d=P.disc,v=Number(d.value)||0;
  var a=roundDisc(d.type==='pct'?r2(sub*v/100):r2(v));return Math.max(0,Math.min(a,sub));
}
function openPay(){
  if(!S.cart.length)return;closeCart();
  var ap=activePay();
  P={disc:null,method:S.ch==='lineman'?'lineman':(ap[0]?ap[0].id:'cash'),received:'',split:false,lines:[],lmno:'',custom:{type:'baht',value:''}};
  renderPay();showModal('wide');
}
function roundCfg(){return ext(clone(DEFAULT_SETTINGS.round),SET.round||{});}
function roundBy(v,mode,step){step=Number(step)||1;if(!mode||mode==='none')return r2(v);var q=v/step;q=Math.round(q*1e6)/1e6;
  q=mode==='up'?Math.ceil(q):mode==='down'?Math.floor(q):Math.round(q);return r2(q*step);}
function roundDisc(a){var c=roundCfg();return roundBy(a,c.disc,c.discStep);}
function billNet(sub,dis){var c=roundCfg();return roundBy(r2(sub-dis),c.bill,c.billStep);}
function payNet(){var sub=cartSub();return billNet(sub,discAmt(sub));}

  // promos

        else h+='<div class="warnbox">ยังไม่ได้ตั้งเลขพร้อมเพย์ของ'+esc(BR().short)+' (หลังบ้าน → ตั้งค่า) — ใช้ QR ป้ายหน้าร้านไปก่อน</div>';

function updPayTotals(){
  // อัปเดตยอดโดยไม่ re-render ช่องกรอก
  var sub=cartSub(),dis=discAmt(sub),net=billNet(sub,dis),rnd=r2(net-(sub-dis));
  var pb=document.querySelector('.paybig');if(pb){pb.querySelector('.v').textContent=baht(net);pb.querySelector('.s').textContent='รวม '+baht(sub)+(dis?' · ส่วนลด −'+baht(dis):'')+(rnd?' · ปัดเศษ '+(rnd>0?'+':'−')+baht(Math.abs(rnd)):'');}
  if($('rcv'))$('rcv').placeholder=money(net);
  if($('splitBox'))bindSplit();
  if($('qrBox')){$('qrBox').innerHTML='';drawQR($('qrBox'),BS().promptpay,net);}
  $('payOk').textContent='✅ ยืนยันรับเงิน '+baht(net);
  updChange();validatePay();

function payIcon(t){return t==='cash'?'💵':t==='qr'?'📱':t==='lineman'?'🛵':'💳';}
function quickNotes(net){var c=[20,50,100,500,1000],o=[];for(var i=0;i<c.length;i++){var v=Math.ceil(net/c[i])*c[i];if(v>net&&o.indexOf(v)<0)o.push(v);}o.sort(function(a,b){return a-b;});return o.slice(0,5);}
function padKey(k){
  var r=P.fresh?'':String(P.received||'');P.fresh=false;
  if(k==='bk')r=r.slice(0,-1);
  else if(k.charAt(0)==='+'){r=String(r2((num(r)||0)+Number(k.slice(1))));P.fresh=false;}
  else if(k==='.'){if(r.indexOf('.')<0)r=(r||'0')+'.';}
  else{if(/\.\d\d$/.test(r)||r.replace('.','').length>=7)return;r=(r==='0'?'':r)+k;}
  P.received=r;$('rcv').value=r;updChange();
}
function updChange(){
  var box=$('chgBox');if(!box)return;var net=payNet(),r=num(P.received);
  if(r==null){box.innerHTML='';validatePay();return;}
  var c=r2(r-net);box.innerHTML='<div class="change'+(c<0?' bad':'')+'"><span>'+(c<0?'เงินไม่พอ':'เงินทอน')+'</span><span>'+baht(Math.abs(c))+'</span></div>';
  validatePay();

    for(var m=0;m<ap2.length;m++)h+='<option value="'+esc(ap2[m].id)+'"'+(P.lines[i].m===ap2[m].id?' selected':'')+'>'+esc(ap2[m].name)+'</option>';
    h+='</select><input class="in" data-sa="'+i+'" inputmode="decimal" style="width:120px;text-align:right" placeholder="0.00" value="'+esc(P.lines[i].amt)+'">'+(P.lines.length>2?'<button class="mini del" data-act="spDel" data-i="'+i+'">✕</button>':'')+'</div>';

function bindSplit(){

function splitSum(){var t=0;for(var i=0;i<P.lines.length;i++)t+=num(P.lines[i].amt)||0;return r2(t);}
function validatePay(){
  var ok=$('payOk');if(!ok)return;var net=payNet(),good=true;

    if(P.split){var s=splitSum(),rem=r2(net-s);var el=$('spRem');if(el)el.innerHTML=rem===0?'<b style="color:var(--ok)">ยอดครบแล้ว</b>':(rem>0?'ยังขาด <b>'+baht(rem)+'</b>':'<b style="color:var(--err)">เกินมา '+baht(-rem)+'</b>');good=rem===0;}

function confirmPay(){
  var sub=cartSub(),dis=discAmt(sub),net=billNet(sub,dis),rnd=r2(net-(sub-dis));
  var pays=[],cashRcv=null,chg=null;
  if(S.ch==='lineman'){pays.push({m:'lineman',name:payDef('lineman').name,type:'lineman',amt:net});}
  else if(P.split){
    for(var i=0;i<P.lines.length;i++){var a=num(P.lines[i].amt)||0;if(a>0){var d=payDef(P.lines[i].m);pays.push({m:d.id,name:d.name,type:d.type,amt:r2(a)});}}
    if(r2(splitSum())!==net){toast('ยอดแยกจ่ายยังไม่ครบ','err');return;}
  } else {
    var md=payDef(P.method);pays.push({m:md.id,name:md.name,type:md.type,amt:net});
    if(md.type==='cash'){var r=num(P.received);cashRcv=r==null?net:r;if(cashRcv<net){toast('รับเงินไม่พอ','err');return;}chg=r2(cashRcv-net);}
  }
  var now=new Date(),bd=ymd(now);
  var items=[];
  for(var j=0;j<S.cart.length;j++){var l=S.cart[j];
    items.push({mid:l.mid,rid:l.rid,name:l.name,qty:l.qty,price:l.price,kind:l.kind,addon:false,note:[l.sweet,l.note].filter(function(x){return !!x;}).join(' · ')});
    for(var k=0;k<l.addons.length;k++){var ad=l.addons[k];items.push({mid:ad.mid,rid:ad.rid,name:ad.name,qty:ad.qty*l.qty,price:ad.price,kind:ad.kind||l.kind,addon:true,note:''});}}
  var vatable=r2(net/1.07),vat=r2(net-vatable),mdisc=memberDiscAmt(),pdisc=r2(dis-mdisc);
  var o={id:uid('o'),bill_no:nextBillNo(bd),branch:BR().name,branch_code:CFG.branch,device:CFG.dev,channel:S.ch,business_date:bd,created_at:now.toISOString(),
    items:items,subtotal:sub,discount:dis,promo_name:pdisc>0?(P.disc.id==='__custom'?('ส่วนลด'+(P.disc.type==='pct'?' '+P.disc.value+'%':'')):P.disc.name):null,rounding:rnd,total:net,vatable:vatable,vat:vat,
    payments:pays,cash_received:cashRcv,change_amt:chg,lm_order_no:(P.lmno||'').trim()||null,status:'paid',void_reason:null,voided_at:null,print_count:0};
  if(S.member&&memOn()&&S.ch!=='lineman')o.member={id:S.member.id,name:S.member.name,card:S.member.card_no||null,phone:S.member.phone||null,disc:mdisc,label:mdisc?memLabel():null};
  queueOrder(o);
  if(o.member)memTouch(o);
  lsSet('last_order',{id:o.id,at:Date.now()});
  S.cart=[];S.member=null;renderCart();
  showDone(o);
  if(SET.autoprint)setTimeout(function(){printOrder(o);},350);

/* ---------------- PromptPay QR (EMVCo) ---------------- */
function tlv(id,v){return id+pad(v.length,2)+v;}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}return ('0000'+c.toString(16).toUpperCase()).slice(-4);}
function promptPayPayload(target,amount){
  var t=String(target||'').replace(/[^0-9]/g,''),tag;
  if(t.length>=15){tag='03';}
  else if(t.length>=13){tag='02';}
  else {tag='01';t=('0000000000000'+t.replace(/^0/,'66')).slice(-13);}
  var mi=tlv('00','A000000677010111')+tlv(tag,t);
  var p=tlv('00','01')+tlv('01',amount>0?'12':'11')+tlv('29',mi)+tlv('53','764')+(amount>0?tlv('54',r2(amount).toFixed(2)):'')+tlv('58','TH')+'6304';
  return p+crc16(p);
}
function qrSVG(text,size){
  var q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
  var n=q.getModuleCount(),qz=2,tot=n+qz*2,d='';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+qz)+' '+(r+qz)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+tot+' '+tot+'" shape-rendering="crispEdges"><rect width="'+tot+'" height="'+tot+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function drawQR(el,target,amount){
  try{el.innerHTML=qrSVG(promptPayPayload(target,amount),240);}catch(e){el.textContent='สร้าง QR ไม่ได้';}
}

function expectedCash(sh){
  var from=ymd(new Date(sh.opened_at));
  return fetchOrders(from,ymd(),CFG.branch).then(function(res){
    var cash=0,cnt=0;
    for(var i=0;i<res.rows.length;i++){var o=res.rows[i];if(o.status==='void'||o.created_at<sh.opened_at)continue;
      for(var p=0;p<o.payments.length;p++)if(o.payments[p].type==='cash'){cash+=+o.payments[p].amt;cnt++;}}
    return {cash:r2(cash),cnt:cnt,exp:r2((+sh.open_cash||0)+cash),offline:res.offline};
  });
}

/* ---------------- auth (Supabase email login) ---------------- */
function tok(){return (MODE==='live'&&SESSION&&SESSION.access_token)?SESSION.access_token:SB_KEY;}
function saveSession(j){SESSION={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,email:String((j.user&&j.user.email)||(SESSION&&SESSION.email)||'').toLowerCase()};lsSet('session',SESSION);}
var _refreshing=null;
function authFresh(){
  if(MODE!=='live'||!SESSION)return Promise.resolve();
  if(Date.now()<SESSION.expires_at-90000)return Promise.resolve();
  if(_refreshing)return _refreshing;
  _refreshing=fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SESSION.refresh_token})})
    .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error('auth '+r.status+' '+(j.error_description||j.msg||''));e.auth=true;throw e;}saveSession(j);});})
    .then(function(){_refreshing=null;},function(e){_refreshing=null;if(e.auth){toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่','err');showLogin();}throw e;});
  return _refreshing;
}
function doLoginReq(email,pw){
  return fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||j.error||('HTTP '+r.status));saveSession(j);});});
}

    if(!r||!r.length){var e=new Error('noprofile');e.noprofile=true;throw e;}

function resizeImg(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var Z=480,c=document.createElement('canvas');c.width=Z;c.height=Z;var x=c.getContext('2d');var s=Math.min(im.width,im.height);
    x.fillStyle='#fff';x.fillRect(0,0,Z,Z);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,Z,Z);cb(c);};
    im.onerror=function(){toast('เปิดรูปไม่ได้','err');};im.src=fr.result;};
  fr.readAsDataURL(file);
}
function sbUpload(path,blob){

function memTouch(o){
  var m=memberById(o.member.id);if(!m)return;
  m.visits=(m.visits||0)+1;m.spent=r2((+m.spent||0)+(+o.total));m.last_visit=o.created_at;m.updated_at=new Date().toISOString();lsSet('members',MEMBERS);
  if(MODE!=='demo')sb('PATCH','pos_members?id=eq.'+encodeURIComponent(m.id),{visits:m.visits,spent:m.spent,last_visit:m.last_visit,updated_at:m.updated_at},'return=minimal').then(null,function(){});
}
function memUntouch(o){
  var m=memberById(o.member.id);if(!m)return;
  m.visits=Math.max(0,(m.visits||0)-1);m.spent=Math.max(0,r2((+m.spent||0)-(+o.total)));m.updated_at=new Date().toISOString();lsSet('members',MEMBERS);
  if(MODE!=='demo')sb('PATCH','pos_members?id=eq.'+encodeURIComponent(m.id),{visits:m.visits,spent:m.spent,updated_at:m.updated_at},'return=minimal').then(null,function(){});
}
function memMatch(q){
  q=String(q||'').trim().toLowerCase();var qd=cleanPhone(q),out=[];
  for(var i=0;i<MEMBERS.length;i++){var m=MEMBERS[i];
    if(!q||(m.card_no||'').toLowerCase().replace(/\s+/g,'').indexOf(q.replace(/\s+/g,''))>=0||(qd.length>=3&&(m.phone||'').indexOf(qd)>=0)||(m.name||'').toLowerCase().indexOf(q)>=0)out.push(m);}
  var ex=memberByCard(q);if(ex){out=out.filter(function(x){return x!==ex;});out.unshift(ex);}
  out.sort(function(a,b){return (b.last_visit||b.joined_at||'')<(a.last_visit||a.joined_at||'')?-1:1;});
  return out;
}
function memRowHTML(m,act){
  var st=memStatus(m);
  return '<button class="mbr" data-act="'+act+'" data-v="'+esc(m.id)+'"><div class="mav">'+(memBday(m)?'🎂':'👤')+'</div><div class="mi"><b>'+esc(m.name||'-')+'</b> <span class="tag '+st[1]+'">'+st[0]+'</span>'+
    '<span>'+memIdTxt(m)+(m.card_no&&m.phone?' · '+fmtPhone(m.phone):'')+(m.expires_at?' · หมดอายุ '+thDate(m.expires_at):'')+'</span></div><div class="mx"><b>'+(m.visits||0)+' ครั้ง</b><span>'+baht(m.spent||0)+'</span></div></button>';
}

    case 'seedPrompt':adminGate(function(){if(confirm('ดึงเมนูจากสูตรใน Stock (recipes)?\nจะเพิ่มเฉพาะเมนูที่ยังไม่มี ไม่แก้ราคาที่ตั้งไว้แล้ว'))seedFromRecipes();});break;
    case 'prEdit':editPromo(v);break;
    case 'prSave':var pp=EDIT_ITEM;pp.name=$('p_n').value.trim();pp.type=$('p_t').value;pp.value=num($('p_v').value)||0;if(!pp.name){toast('ใส่ชื่อโปร','err');break;}savePromo(pp,function(){closeModal();renderPromoAdmin();});break;
    case 'prAct':var pr=promoById(v);pr.active=pr.active===false;savePromo(pr,renderPromoAdmin);break;
    case 'payTg':for(var k=0;k<SET.pay.length;k++)if(SET.pay[k].id===v){SET.pay[k].active=!SET.pay[k].active;t.classList.toggle('on',SET.pay[k].active);}pushSettings();break;
    case 'payAdd':$('modal').className='';$('modal').innerHTML='<div class="mh"><h2>💳 เพิ่มช่องทางชำระเงิน</h2><button class="x" data-act="close">✕</button></div><div class="mb"><div class="fld"><label class="lbl">ชื่อช่องทาง (พิมพ์บนใบเสร็จและสรุปยอด)</label><input class="in" id="pa_n" placeholder="เช่น Grab, ShopeeFood, บัตรเครดิต, คนละครึ่ง"></div><div class="fld"><label class="lbl">ประเภท</label><select class="in" id="pa_t"><option value="online">ออนไลน์ / โอน (ไม่เปิดลิ้นชัก)</option><option value="qr">แสดง QR พร้อมเพย์ของสาขา</option></select></div><button class="btn" data-act="payAddOk">เพิ่ม</button></div>';showModal();setTimeout(function(){$('pa_n').focus();},50);break;
    case 'payAddOk':var pn=$('pa_n').value.trim();if(!pn){toast('ใส่ชื่อช่องทาง','err');break;}SET.pay.push({id:uid('pm_'),name:pn,type:$('pa_t').value,active:true,custom:true});pushSettings();closeModal();renderSettings();break;
    case 'payDel':var pd=null;for(var k2=0;k2<SET.pay.length;k2++)if(SET.pay[k2].id===v)pd=SET.pay[k2];if(pd&&confirm('ลบช่องทาง "'+pd.name+'"?\nบิลเก่าที่ใช้ช่องทางนี้ยังอยู่ในสรุปยอดตามเดิม')){SET.pay=SET.pay.filter(function(x){return x.id!==v;});pushSettings();renderSettings();}break;
    case 'apTg':SET.autoprint=!SET.autoprint;t.classList.toggle('on',SET.autoprint);break;
    case 'setSave':saveSettings();break;
    case 'testPrint':passprnt(receiptHTML({bill_no:'TEST-0000',branch_code:CFG.branch,device:CFG.dev,channel:'walkin',created_at:new Date().toISOString(),items:[{name:'*** ทดสอบการพิมพ์ ***',qty:1,price:0}],subtotal:0,discount:0,total:0,vatable:0,vat:0,payments:[],status:'paid'},false),false);break;
    case 'setupAgain':showSetup();break;
    case 'back':setView('sell');break;
    case 'login':doLogin();break;
    case 'demo':startDemo();break;
    case 'logout':logout();break;
    case 'exitDemo':exitDemo();break;
    case 'spk':spKey(v);break;
    case 'spSkip':S.skipShift=true;closeModal();break;
    case 'spOk':shiftOpenWith(num(SPAD)||0);closeModal();break;
    case 'hold':openHold();break;
    case 'swAdd':var bx=document.createElement('div');bx.style.cssText='display:flex;gap:8px;margin-bottom:8px';bx.innerHTML='<input class="in" style="flex:1" data-sw="1" placeholder="เช่น หวาน 50%"><button class="mini del" data-act="swRm">✕</button>';$('swList').appendChild(bx);bx.firstChild.focus();break;
    case 'swDel':case 'swRm':t.parentNode.parentNode.removeChild(t.parentNode);saveSweet();break;
    case 'holdNow':holdNow($('hdLbl')?$('hdLbl').value:'');closeModal();toast('พักบิลแล้ว','ok');break;
    case 'holdBack':holdBack(i);break;
    case 'holdDel':if(confirm('ลบบิลที่พักไว้?')){HELD.splice(i,1);lsSet('held',HELD);updRail();openHold();}break;
    case 'imgDel':EDIT_ITEM.img=null;drawImgBox();break;
    case 'menuUpload':uploadMenu();break;
    case 'menuPospos':replaceMenuPospos();break;
    case 'hnpTg':SET.hideNoPrice=!SET.hideNoPrice;t.classList.toggle('on',SET.hideNoPrice);pushSettings(true);renderSell();break;
    case 'suBr':enterBranch(v);break;
    case 'retryEnter':startApp();break;
    case 'navOpen':navOpen();break;
    case 'navClose':navClose();break;
    case 'navGo':navGo(v);break;
    case 'memPickCart':openMemberPick('cart');break;
    case 'memPickPay':openMemberPick('pay');break;
    case 'mpBack':backToPay();break;
    case 'memPick':var mpk=memberById(v);if(mpk)memAttach(mpk);break;
    case 'memClear':S.member=null;renderCart();break;
    case 'memClearPay':S.member=null;renderCart();backToPay();break;
    case 'memNewPick':MEM_BACK=drawMemberPick;MEM_AFTER=function(m){memAttach(m);};editMember(null,MQ.q);break;
    case 'memNew':MEM_BACK=null;MEM_AFTER=function(){closeModal();renderMembers();};editMember(null,MV.q);break;
    case 'memFormBack':var mb=MEM_BACK;MEM_BACK=null;MEM_AFTER=null;if(mb)mb();else closeModal();break;
    case 'memSave':memSaveForm();break;
    case 'memDel':memDelete(v);break;
    case 'memOpen':memOpen(v);break;
    case 'memEdit':MEM_BACK=function(){memOpen(v);};MEM_AFTER=function(m){if(S.member&&S.member.id===m.id)S.member=memSnap(m);renderCart();memOpen(m.id);if(S.view==='members')renderMembers();};editMember(v);break;
    case 'memRenew':memRenew(v,function(m){memOpen(m.id);if(S.view==='members')renderMembers();});break;
    case 'memUse':var mu=memberById(v);if(mu){MQ.ret=null;memAttach(mu);if(S.view!=='sell')setView('sell');}break;
    case 'memFromOrder':var mo_=BILLCACHE[v]||ORD[v];if(!mo_)break;var cmo=cardMonths(mo_);if(mo_.member&&memberById(mo_.member.id))memRenew(mo_.member.id,function(){closeModal();},cmo);else{MEM_BACK=null;MEM_AFTER=function(m){closeModal();};editMember(null,'',cmo);}break;
    case 'mbTier':var tb=$('mb_tier').querySelectorAll('button');for(var tq=0;tq<tb.length;tq++)tb[tq].classList.toggle('on',tb[tq].getAttribute('data-v')===v);$('mb_exf').style.display=v==='vip'?'none':'';
      if(v==='year'&&!$('mb_ex').value){var tmp={expires_at:null};memExtend(tmp,EDIT_MEM._mo||12);$('mb_ex').value=tmp.expires_at;}break;
    case 'mvF':MV.f=v;renderMembers();break;
    case 'memTg':var mc=memCfg();mc.on=!(mc.on!==false);mc.rule=2;SET.member=mc;t.classList.toggle('on',mc.on);pushSettings();renderCart();break;
    case 'cardAdd':var cid=$('ms_addc').value;if(!cid)break;var mcx=memCfg();mcx.cards=memCardsFromForm();if(!cardOf(cid)||!mcx.cards.some(function(x){return x.id===cid;}))mcx.cards.push({id:cid,months:12});mcx.rule=2;SET.member=mcx;pushSettings(true);renderPromoAdmin();break;
    case 'cardDel':var mcd=memCfg();mcd.cards=memCardsFromForm().filter(function(x){return x.id!==v;});mcd.rule=2;SET.member=mcd;if(!mcd.cards.length)mcd.cards=[{id:'__none',months:0}];pushSettings(true);renderPromoAdmin();break;
    case 'memSetSave':var mc2=memCfg();mc2.name=$('ms_n').value.trim()||'ส่วนลดสมาชิก';mc2.type=$('ms_t').value;mc2.value=num($('ms_v').value)||0;mc2.scope=$('ms_s').value;mc2.combine=$('ms_c').value==='1';mc2.rule=2;mc2.months=Math.max(1,Math.round(num($('ms_m').value)||12));mc2.cards=memCardsFromForm();
      if(mc2.type==='pct'&&mc2.value>100){toast('ส่วนลดเกิน 100%','err');break;}SET.member=mc2;pushSettings();renderCart();break;
    case 'arSel':AR.sel=v;renderArrange();break;
    case 'catHide':var chs=SET.catHide||[],chi=chs.indexOf(v);if(chi>=0)chs.splice(chi,1);else chs.push(v);SET.catHide=chs;pushSettings(true);toast((chi>=0?'แสดงหมวด ':'ซ่อนหมวด ')+v+(chi>=0?' ในหน้าขายแล้ว':' จากหน้าขายแล้ว'),'ok');renderArrange();renderSell();break;
    case 'arMv':arMove(v,i,d);break;
    case 'arReset':AR=null;renderArrange();break;
    case 'arSave':arSave();break;
    case 'uiSz':uiSet('size',v);break;
    case 'uiFit':uiSet('fit',v);break;
    case 'uiImg':uiSet('img',!uiCfg().img);break;
    case 'uiSplit':S.cat=null;uiSet('split',v==='1');break;
  }
});
function showSetupSel(){var bs=$('setup').querySelectorAll('[data-act="suBr"]'),ds=$('setup').querySelectorAll('[data-act="suDev"]');
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===SU.branch);
  for(var j=0;j<ds.length;j++)ds[j].classList.toggle('on',+ds[j].getAttribute('data-v')===SU.dev);}
function closeCart(){$('cart').classList.remove('open');$('cartShade').classList.add('hide');}
$('q').addEventListener('input',function(){S.q=this.value;renderSell();});
window.addEventListener('online',flush);
function saveSweet(){var a=[],l=document.querySelectorAll('[data-sw]');for(var i=0;i<l.length;i++){var v=l[i].value.trim();if(v&&a.indexOf(v)<0)a.push(v);}SET.sweet=a;pushSettings();}
document.addEventListener('change',function(e){if(!e.target||!e.target.getAttribute)return;if(e.target.getAttribute('data-sw'))saveSweet();
  var pid=e.target.getAttribute('data-pay');if(pid){var nv=e.target.value.trim();for(var i=0;i<SET.pay.length;i++)if(SET.pay[i].id===pid&&nv)SET.pay[i].name=nv;pushSettings();}});
setInterval(flush,20000);

/* ---------------- boot ---------------- */
function handleReturn(qs){
  qs=qs||location.search;
  if(qs.indexOf('passprnt_code')<0)return;
  var code=(qs.match(/passprnt_code=([^&]*)/)||[])[1];
  var msg=decodeURIComponent(((qs.match(/passprnt_message=([^&]*)/)||[])[1]||'').replace(/\+/g,' '));
  if(!isNative()){try{history.replaceState(null,'',location.pathname);}catch(e){}}
  if(code==='0')toast('🖨️ พิมพ์สำเร็จ','ok');else toast('พิมพ์ไม่สำเร็จ ('+code+') '+msg+' — กดพิมพ์ซ้ำจากหน้าบิล','err');
  var lo=lsGet('last_order',null);
  if(lo&&Date.now()-lo.at<120000&&ORD[lo.id]){var o=ORD[lo.id];lsSet('last_order',null);if(o.change_amt!=null&&o.change_amt>0)showDone(o);}
}
function boot(){
  mergeDefaultsPay();
  SHIFT=lsGet('shift_'+CFG.branch,null);
  setView(S.view||'home');renderAll();setSync(OUTBOX.length?'err':'busy');
  loadRemote();recoverSeq();loadRecipesQuiet();
  handleReturn();
  initPlatform();
}
function initPlatform(){
  // แอพ iOS: รับผลการพิมพ์ที่ PassPRNT ส่งกลับมาทาง coffeetodaypos://passprnt?passprnt_code=…
  if(isNative()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App&&!S.appUrlHooked){
    S.appUrlHooked=true;
    window.Capacitor.Plugins.App.addListener('appUrlOpen',function(d){var u=String((d&&d.url)||'');var i=u.indexOf('?');if(i>=0)handleReturn(u.slice(i));});
    window.Capacitor.Plugins.App.addListener('resume',function(){flush();});
  }
  // เว็บ/PWA: service worker ให้เปิดแอพได้แม้เน็ตหลุด (เฉพาะ https / localhost)
  if(!isNative()&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!S.swDone){
    S.swDone=true;
    navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(reg){
      if(reg.active)reg.active.postMessage({type:'cache-page',url:location.href.split('?')[0].split('#')[0]});
    }).catch(function(){});
  }
}
startApp();
</script>
